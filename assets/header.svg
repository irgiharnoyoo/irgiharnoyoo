<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Irgi Harnoyoo">
  <defs>
    <!-- gradient warna yang bergerak -->
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7c5cff">
        <animate attributeName="stop-color" values="#7c5cff;#22d3ee;#f59e0b;#f43f5e;#7c5cff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%"  stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#f59e0b;#f43f5e;#7c5cff;#22d3ee" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#f43f5e;#7c5cff;#22d3ee;#f59e0b" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowA">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- reveal kiri ke kanan (efek "kata keluar") -->
    <clipPath id="revealName">
      <rect x="70" y="70" width="0" height="120">
        <animate attributeName="width" from="0" to="1060" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
    <clipPath id="revealSub">
      <rect x="70" y="200" width="0" height="60">
        <animate attributeName="width" from="0" to="1060" dur="1.6s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- latar -->
  <rect width="1200" height="340" rx="18" fill="#0b0d12"/>

  <!-- cahaya bergerak -->
  <g>
    <circle cx="180" cy="90" r="230" fill="url(#glowA)">
      <animate attributeName="cx" values="180;1020;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;250;90" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="260" r="210" fill="url(#glowB)">
      <animate attributeName="cx" values="1000;200;1000" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;80;260" dur="17s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- garis tepi berdenyut -->
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="url(#flow)" stroke-width="2" opacity=".55">
    <animate attributeName="opacity" values=".25;.7;.25" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- nama: muncul dari kiri -->
  <g clip-path="url(#revealName)">
    <text x="70" y="152"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="86" font-weight="800" letter-spacing="6"
          fill="url(#flow)">IRGI HARNOYOO</text>
  </g>

  <!-- garis bawah yang tumbuh -->
  <rect x="72" y="176" width="0" height="5" rx="2.5" fill="url(#flow)">
    <animate attributeName="width" from="0" to="420" dur="1.1s" begin="1.7s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
  </rect>

  <!-- subjudul: muncul belakangan -->
  <g clip-path="url(#revealSub)">
    <text x="70" y="236"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="26" font-weight="500" letter-spacing="3"
          fill="#9aa6ba">Full-stack learner &#183; TypeScript &#183; React &#183; Node</text>
  </g>

  <!-- kursor berkedip -->
  <rect x="970" y="216" width="14" height="26" fill="#f59e0b" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" dur="1.1s" begin="3s" repeatCount="indefinite"/>
  </rect>
</svg>
